<!doctype html>
<!-- Source of social-preview.png (1280x640): rendered with Playwright, with LOGO replaced by
     mica-flame.svg as a data URL. The strip uses the same automaton as the playground. -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; }
body { width: 1280px; height: 640px; background: #141210; color: #f2eee9; overflow: hidden; position: relative;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
canvas { position: absolute; left: 0; bottom: 0; width: 1280px; height: 120px; }
.logo { position: absolute; left: 96px; top: 118px; width: 196px; }
.txt { position: absolute; left: 350px; top: 112px; right: 40px; }
h1 { margin: 0; font-size: 104px; letter-spacing: -0.03em; line-height: 1; }
h1 span { color: #fb923c; }
p.sub { margin: 18px 0 0; font-size: 31px; line-height: 1.3; color: #d9d2ca; }
.demo { margin-top: 34px; font-size: 30px; padding: 14px 20px; background: #1d1a17; border: 1px solid #36302a;
  border-radius: 14px; display: inline-block; }
.demo .p { color: #8f867c; } .demo .o { background: #3a2415; color: #fde3cf; border-radius: 6px; padding: 0 6px; }
.url { position: absolute; right: 80px; top: 52px; font-size: 22px; color: #a39a90; }
</style></head><body>
<div class="url">mica-ai-ten.vercel.app</div>
<img class="logo" src="LOGO">
<div class="txt">
  <h1>MICA <span>AI</span></h1>
  <p class="sub">An integer cellular automaton that writes language.<br>No neural network. No floating point.</p>
  <div class="demo"><span class="p">Can you help me</span><span class="o">find a hotel?</span></div>
</div>
<canvas id="c" width="1280" height="120"></canvas>
<script>
// Automaton strip in the same style as the playground's thinking panel.
const g = document.getElementById('c').getContext('2d'), size = 8, cols = 160, rows = 15;
let h = 2166136261;
for (const ch of 'MICA') h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
const rnd = () => ((h = Math.imul(h ^ (h >>> 15), 2246822519) ^ Math.imul(h, 3266489917)) >>> 0) / 4294967296;
const bytes = [...new TextEncoder().encode('Can you help me find a hotel?')];
const inject = (row, t) => { if (t % 16) return; const b = bytes[(t / 16) % bytes.length], hd = ((t / 16) * 7) % cols;
  for (let k = 0; k < 4; k++) row[(hd + k) % cols] = 1 + ((b >> (2 * k)) % 3); };
const step = (tb, r) => r.map((c, i) => tb[r[(i + cols - 1) % cols] * 16 + c * 4 + r[(i + 1) % cols]]);
let table, best = 1e9;
for (let t = 0; t < 300; t++) {
  const tb = Array.from({ length: 64 }, () => (rnd() < 0.6 ? 0 : 1 + ((rnd() * 3) | 0))); tb[0] = 0;
  let r = new Array(cols).fill(0), d = 0, ch = 0;
  for (let k = 0; k < 400; k++) { const n = step(tb, r); inject(n, k);
    if (k >= 240) for (let i = 0; i < cols; i++) { d += n[i] > 0; ch += n[i] !== r[i]; } r = n; }
  d /= 160 * cols; ch /= 160 * cols;
  const s = Math.max(0, 0.22 - d, d - 0.4) + Math.max(0, 0.18 - ch, ch - 0.35);
  if (s < best) { best = s; table = tb; } if (s === 0) break;
}
let r = new Array(cols).fill(0); const hist = [];
for (let k = 0; k < 300; k++) { const n = step(table, r); inject(n, k); r = n; hist.push(r); if (hist.length > rows) hist.shift(); }
hist.forEach((row, y) => row.forEach((c, x) => { if (!c) return;
  g.globalAlpha = [0, .25, .55, .95][c] * (0.35 + 0.65 * y / rows); g.fillStyle = '#fb923c';
  g.fillRect(x * size, y * size, size - 1, size - 1); }));
</script>
</body></html>
